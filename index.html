
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mapa de Mesas - Nazia e Arão</title>

<style>
* {
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
}

body {
    margin: 0;
    padding: 20px;
    background: #f7f5f0;
    text-align: center;
}

.brand-title {
    color: #b89759;
    font-size: 35px;
    font-weight: bold;
    letter-spacing: 3px;
    margin: 10px;
    text-transform: uppercase;
}

h1 {
    color: #555;
    font-size: 17px;
    font-weight: normal;
    margin-bottom: 20px;
}

.search-container {
    width: 100%;
    max-width: 500px;
    margin: 0 auto 20px;
}

.search-input {
    width: 100%;
    padding: 15px 20px;
    border: 2px solid #b89759;
    border-radius: 30px;
    font-size: 16px;
    outline: none;
    background: white;
}

.search-input:focus {
    box-shadow: 0 0 12px #b8975966;
}

.no-results {
    min-height: 25px;
    margin-top: 10px;
    font-weight: bold;
}

.map-wrapper {
    position: relative;
    width: 100%;
    max-width: 1024px;
    margin: auto;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 8px 25px #0003;
}

.map-image {
    width: 100%;
    height: auto;
    display: block;
}

/* MARCADORES DAS MESAS */

.pin {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 9%;
    height: 6.5%;
    border: 3px solid transparent;
    border-radius: 9px;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    transition: opacity .2s;
}

.pin.active {
    opacity: 1;
    border-color: #ff2020;
    background: rgba(255, 0, 0, .28);
    box-shadow: 0 0 18px 7px rgba(255, 0, 0, .65);
    animation: pulse 0.8s infinite alternate;
}

/* MESAS INCLINADAS */

.pin.inclined {
    transform: translate(-50%, -50%) rotate(-38deg);
}

/* ANIMAÇÃO */

@keyframes pulse {
    from {
        filter: brightness(1);
        scale: 1;
    }
    to {
        filter: brightness(1.4);
        scale: 1.08;
    }
}

@media(max-width:600px) {
    body {
        padding: 10px;
    }

    .brand-title {
        font-size: 23px;
    }

    h1 {
        font-size: 14px;
    }

    .search-input {
        font-size: 14px;
    }

    .pin {
        border-width: 2px;
    }
}
</style>
</head>

<body>

<div class="brand-title">
    Nazia e Arão
</div>

<h1>Localizador de Mesas</h1>

<div class="search-container">

    <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Digite o número da mesa..."
        autocomplete="off"
        list="sugestoes-mesas"
    >

    <datalist id="sugestoes-mesas">
        <option value="Mesa 1">
        <option value="Mesa 2">
        <option value="Mesa 3">
        <option value="Mesa 4">
        <option value="Mesa 5">
        <option value="Mesa 6">
        <option value="Mesa 7">
        <option value="Mesa 8">
        <option value="Mesa 9">
        <option value="Mesa 10">
        <option value="Mesa 11">
        <option value="Mesa 12">
        <option value="Mesa 13">
        <option value="Mesa 14">
        <option value="Mesa 15">
        <option value="Mesa 16">
        <option value="Mesa 17">
        <option value="Mesa 18">
        <option value="Mesa 19">
        <option value="Mesa 19A">
        <option value="Mesa 19B">
        <option value="Mesa 20">
    </datalist>

    <div id="statusMessage" class="no-results"></div>

</div>

<div class="map-wrapper">

    <!-- IMAGEM ORIGINAL DO MAPA 3D -->

    <img
        src="1.jpeg"
        class="map-image"
        alt="Mapa 3D das mesas Cristina e Ussumane"
    >

    <!-- MESAS SUPERIORES -->

    <div class="pin" id="mesa14"
         style="left:36%;top:5.7%;width:5.5%;"></div>

    <div class="pin" id="mesa16"
         style="left:42%;top:5.7%;width:5.5%;"></div>

    <div class="pin inclined" id="mesa20"
         style="left:16.6%;top:13.8%;width:10%;height:8%;"></div>

    <div class="pin" id="mesa10"
         style="left:30.3%;top:15%;"></div>

    <div class="pin" id="mesa18"
         style="left:43%;top:15%;"></div>

    <div class="pin inclined" id="mesa19b"
         style="left:57.2%;top:14%;width:10%;height:8%;"></div>

    <!-- SEGUNDA FILA -->

    <div class="pin" id="mesa19a"
         style="left:19.3%;top:26.8%;"></div>

    <div class="pin" id="mesa12"
         style="left:30.3%;top:26.8%;"></div>

    <div class="pin" id="mesa17"
         style="left:41.6%;top:26.8%;"></div>

    <div class="pin" id="mesa8"
         style="left:52.3%;top:26.8%;"></div>

    <!-- TERCEIRA FILA -->

    <div class="pin" id="mesa2"
         style="left:23.8%;top:35.4%;width:13%;"></div>

    <div class="pin" id="mesa4"
         style="left:41.1%;top:35.5%;width:13%;"></div>

    <div class="pin" id="mesa6"
         style="left:54.4%;top:39.9%;width:8%;height:9%;"></div>

    <!-- QUARTA FILA -->

    <div class="pin" id="mesa1"
         style="left:24.1%;top:58.8%;width:13%;"></div>

    <div class="pin" id="mesa3"
         style="left:44.5%;top:58.8%;width:13%;"></div>

    <!-- QUINTA FILA -->

    <div class="pin" id="mesa5"
         style="left:24.1%;top:66.1%;width:13%;"></div>

    <div class="pin" id="mesa7"
         style="left:49.8%;top:66.1%;width:13%;"></div>

    <!-- ÚLTIMA FILA -->

    <div class="pin" id="mesa11"
         style="left:19.2%;top:75.3%;"></div>

    <div class="pin" id="mesa9"
         style="left:30.2%;top:75.4%;"></div>

    <div class="pin" id="mesa13"
         style="left:44.1%;top:75.3%;"></div>

    <div class="pin" id="mesa15"
         style="left:55%;top:75.3%;"></div>

</div>

<script>

const searchInput = document.getElementById("searchInput");
const statusMessage = document.getElementById("statusMessage");

const pins = document.querySelectorAll(".pin");

/* NORMALIZAR PESQUISA */

function normalizar(texto) {

    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/^mesa\s*/i, "")
        .replace(/[\s'’_-]/g, "")
        .trim();

}

/* LOCALIZAR MESAS */

function pesquisarMesa() {

    let pesquisa = normalizar(searchInput.value);

    // Remover destaques anteriores

    pins.forEach(pin => {
        pin.classList.remove("active");
    });

    statusMessage.textContent = "";

    if (pesquisa === "") {
        return;
    }

    let mesasEncontradas = [];

    // Mesa 19: destacar 19A e 19B

    if (pesquisa === "19") {

        mesasEncontradas = [
            "mesa19a",
            "mesa19b"
        ];

    }

    // Mesa 19A

    else if (pesquisa === "19a") {

        mesasEncontradas = ["mesa19a"];

    }

    // Mesa 19B

    else if (pesquisa === "19b") {

        mesasEncontradas = ["mesa19b"];

    }

    // Mesa 20 (também aceita 20')

    else if (pesquisa === "20") {

        mesasEncontradas = ["mesa20"];

    }

    // Mesas normais de 1 a 18

    else if (/^(?:[1-9]|1[0-8])$/.test(pesquisa)) {

        mesasEncontradas = ["mesa" + pesquisa];

    }

    // Verificar se a mesa existe

    if (mesasEncontradas.length === 0) {

        statusMessage.style.color = "#d9534f";

        statusMessage.textContent =
            "Mesa não encontrada! Verifique a numeração.";

        return;

    }

    // Destacar as mesas encontradas

    mesasEncontradas.forEach(id => {

        const mesa = document.getElementById(id);

        if (mesa) {
            mesa.classList.add("active");
        }

    });

    // Mensagem de confirmação

    statusMessage.style.color = "#198754";

    if (pesquisa === "19") {

        statusMessage.textContent =
            "Mesas 19A e 19B encontradas com sucesso!";

    } else {

        statusMessage.textContent =
            "Mesa " + pesquisa.toUpperCase() +
            " encontrada com sucesso!";

    }

}

/* PESQUISA AUTOMÁTICA */

searchInput.addEventListener("input", pesquisarMesa);

searchInput.addEventListener("change", pesquisarMesa);

</script>

</body>
</html>
